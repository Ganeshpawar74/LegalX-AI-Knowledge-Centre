services:
  - type: web
    name: legalx-ai
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port=$PORT --server.address=0.0.0.0 --logger.level=error
    envVars:
      - key: MISTRAL_API_KEY
        fromDatabase:
          name: default
          property: mistral_api_key
